<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>30 Años: La Partida Perfecta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Press Start 2P',monospace;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#tv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1a1a 0%,#000 75%)}
#screen{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;overflow:hidden;border-radius:2%/3.5%;box-shadow:0 0 0 4px #111,0 0 40px rgba(80,160,255,.15);cursor:pointer;touch-action:none}
/* Celular en vertical: se gira el juego para que llene la pantalla (sostén el celular de lado) */
@media (orientation:portrait){#screen{width:min(100vh,calc(100vw*16/9));transform:rotate(90deg);flex-shrink:0}}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.crt{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.12) 3px)}
.vignette{pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 65%,rgba(0,0,0,.45) 100%)}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;background:#03051a;text-align:center;padding:4%;z-index:5;cursor:default}
#start h1{font-size:clamp(12px,3.2vmax,32px);color:#ffd84a;text-shadow:3px 3px 0 #b5321f;line-height:1.7;font-weight:normal}
#start .sub{font-size:clamp(7px,1.3vmax,13px);color:#9ad;line-height:1.8}
#modes{display:flex;gap:4%;width:100%;justify-content:center;flex-wrap:wrap}
.mode{font-family:inherit;cursor:pointer;border:3px solid #fff;box-shadow:4px 4px 0 #000;padding:3.5% 4%;min-width:70%;color:#fff;display:flex;flex-direction:column;gap:10px;align-items:center}
.mode b{font-weight:normal;font-size:clamp(12px,3.4vmax,24px)}
.mode span{font-size:clamp(8px,1.6vmax,14px);color:#ffe;opacity:.85;line-height:1.6}
.mode:hover,.mode:focus,.mode:active{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000;outline:none}
#mGame{background:#b5321f}
#start .vol{font-size:clamp(7px,1.2vmax,12px);color:#888;line-height:2}
#ui{position:absolute;right:1.5%;top:2%;display:flex;gap:8px;opacity:0;transition:opacity .4s;z-index:4}
#ui{pointer-events:none}#ui.show{opacity:1;pointer-events:auto}
#ui button{font-family:inherit;font-size:clamp(7px,1vmax,11px);background:rgba(20,20,40,.85);color:#fff;border:2px solid #fff;padding:8px 10px;cursor:pointer}
#again{position:absolute;left:3%;top:3%;display:none;font-family:inherit;font-size:clamp(7px,1.1vmax,12px);background:#b5321f;color:#fff;border:3px solid #fff;padding:8px 10px;cursor:pointer;box-shadow:4px 4px 0 #000;z-index:4}
</style>
</head>
<body>
<div id="tv"><div id="screen">
  <canvas id="c" width="320" height="180"></canvas>
  <div class="crt"></div><div class="vignette"></div>
  <button id="again">¿JUGAR OTRA VEZ?</button>
  <div id="ui"><button id="pause">PAUSA</button><button id="mute">SONIDO: SÍ</button><button id="menu">MENÚ</button></div>
  <div id="start">
    <h1>30 AÑOS<br>LA PARTIDA PERFECTA</h1>
    <div class="sub" id="startSub"></div>
    <div id="modes">
      <button class="mode" id="mGame"><b>&#9654; JUGAR</b><span>Toca la pantalla para avanzar</span></button>
    </div>
    <div class="vol">Sube el volumen y pon el celular de lado<br>Hay un nivel para jugar entre dos</div>
  </div>
</div></div>

<script>
/* =========================================================
   CONFIGURACIÓN — cambia estos textos a tu gusto
   ========================================================= */
const CONFIG = {
  mama: 'MAMÁ',              // nombre o apodo de tu mamá
  papa: 'PAPÁ',              // nombre o apodo de tu papá
  anioBoda: 1996,
  anioGemelos: 2009,
  mensaje: ['Gracias por enseñarnos', 'lo que es el amor de verdad.'],
  firma: '- Sus hijos',
  papaTeniaPelo: true,       // false = calvo desde la boda
  fotoFinal: ''              // ej. 'foto.jpg' para poner una foto real en el cuadro
};

/* ===================== BASE DE DIBUJO ===================== */
const cv=document.getElementById('c'),mainCtx=cv.getContext('2d');
let ctx=mainCtx;
const W=320,H=180;
mainCtx.imageSmoothingEnabled=false;
const FONT="'Press Start 2P', monospace";
const PAL=['#ff5a7a','#ffd84a','#5ad1ff','#5affa0','#c58aff','#ff9a3c'];
const Y0=CONFIG.anioBoda,YG=CONFIG.anioGemelos;
let SCORE=0;

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}
function withCtx(x,fn){const o=ctx;ctx=x;try{fn();}finally{ctx=o;}}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function T(str,x,y,o={}){
  const size=o.size||8;ctx.font=size+'px '+FONT;ctx.textAlign=o.align||'center';ctx.textBaseline='top';
  if(o.shadow!==false){const d=size>=16?2:1;ctx.fillStyle=o.shadowColor||'#000';ctx.fillText(str,Math.round(x)+d,Math.round(y)+d);}
  ctx.fillStyle=o.color||'#fff';ctx.fillText(str,Math.round(x),Math.round(y));
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const ease=p=>{p=clamp(p,0,1);return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;};
function bounce(p){p=clamp(p,0,1);const n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d)return n*(p-=1.5/d)*p+.75;if(p<2.5/d)return n*(p-=2.25/d)*p+.9375;return n*(p-=2.625/d)*p+.984375;}
const blinkOn=(t,r=2)=>Math.floor(t*r)%2===0;
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function toHex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
function mixHex(a,b,p){const A=hex(a),B=hex(b);return toHex(...A.map((v,i)=>v+(B[i]-v)*p));}
const dk=(c,f=.78)=>{const A=hex(c);return toHex(A[0]*f,A[1]*f,A[2]*f);};
const lg=(c,p=.25)=>mixHex(c,'#ffffff',p);
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function dgrad(x0,y0,w,h,c1,c2,steps=6){const lv=[];for(let k=0;k<steps;k++)lv.push(mixHex(c1,c2,k/(steps-1)));
  for(let y=0;y<h;y++){const f=(y/Math.max(1,h-1))*(steps-1),i=Math.floor(f),fr=f-i;
    let run=0,cur=null;for(let x=0;x<=w;x++){let c=null;if(x<w){const b=BAY[((y0+y)&3)*4+((x0+x)&3)]/16;c=(fr>b&&i+1<steps)?lv[i+1]:lv[i];}
      if(c!==cur){if(cur){ctx.fillStyle=cur;ctx.fillRect(x0+x-run,y0+y,run,1);}cur=c;run=1;}else run++;}}}
function circ(cx,cy,r,c){for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));R(cx-w,cy+y,w*2,1,c);}}
function sprite(rows,x,y,s,map){for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const c=map[rows[j][i]];if(c)R(x+i*s,y+j*s,s,s,c);}}
const HEART=['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'];
const STAR=['..X..','.XXX.','XXXXX','.XXX.','..X..'];
const CHECK=['......X','.....XX','X...XX.','XX.XX..','.XXX...','..X....'];
function heart(cx,cy,s,c='#ff3b6b'){sprite(HEART,cx-3.5*s,cy-3*s,s,{X:c});if(s>=2)R(cx-2.5*s,cy-2*s,s,s,lg(c,.55));}
function star(cx,cy,s,c='#fff'){sprite(STAR,cx-2.5*s,cy-2.5*s,s,{X:c});}
const STARS=Array.from({length:90},(_,i)=>{const r=rng(i+11);return{x:r()*W,y:r()*H,p:r()*6};});
function drawStars(t,a=1){ctx.globalAlpha=a;for(const s of STARS){const b=(Math.sin(t*1.5+s.p)+1)/2;R(s.x,s.y,1,1,b>.5?'#fff':'#6a7ab0');}ctx.globalAlpha=1;}
function panel(x,y,w,h){R(x,y,w,h,'#0b1640');R(x,y,w,2,'#fff');R(x,y+h-2,w,2,'#fff');R(x,y,2,h,'#fff');R(x+w-2,y,2,h,'#fff');R(x+3,y+3,w-6,1,'#2c4aa8');R(x+3,y+h-4,w-6,1,'#050a20');}
function flagGT(x,y){R(x-9,y-1,18,12,'#1a1020');R(x-8,y,5,10,'#4997d0');R(x-3,y,6,10,'#fff');R(x+3,y,5,10,'#4997d0');R(x-1,y+4,2,2,'#5a9a3a');R(x-2,y+6,4,1,'#c8a040');}
function flagUS(x,y){R(x-9,y-1,18,12,'#1a1020');for(let i=0;i<10;i++)R(x-8,y+i,16,1,i%2?'#fff':'#b22234');R(x-8,y,7,5,'#3c3b6e');for(let i=0;i<3;i++)R(x-7+i*2,y+1+(i%2)*2,1,1,'#fff');}
function globe(x,y){circ(x,y+5,6,'#1a1020');circ(x,y+5,5,'#2c6ad8');R(x-3,y+1,3,3,'#3fae5a');R(x,y+5,2,4,'#3fae5a');R(x-1,y+9,2,1,'#3fae5a');R(x-3,y+2,1,1,'#a8e8ff');}
function banner(str,y,fg='#ffd84a',bg='#b5321f'){const w=str.length*8+16,x=160-w/2;R(x-2,y-2,w+4,20,'#1a1020');R(x,y,w,16,bg);R(x,y,w,2,lg(bg,.35));R(x,y+14,w,2,dk(bg,.7));T(str,160,y+4,{color:fg});}
function hud(level,year){R(0,0,W,11,'rgba(10,10,30,.78)');T(level,4,2,{align:'left'});T('PUNTOS '+String(SCORE).padStart(5,'0'),160,2);T(year,W-4,2,{align:'right',color:'#ffd84a'});}
function promptBox(str,y=164){if(!blinkOn(RT,1.3))return;const w=str.length*8+28,x=160-w/2;R(x-2,y-2,w+4,18,'#1a1020');R(x,y,w,14,'#ffffff');circ(x+9,y+7,5,'#d6302a');T('A',x+9,y+3,{color:'#fff',shadow:false});T(str,x+18+(w-20)/2,y+3,{color:'#1a1020',shadow:false});}
function bubble(x,y,str){const w=str.length*8+10,h=16,bx=Math.round(x-w/2);R(bx-1,y-1,w+2,h+2,'#1a1020');R(bx,y,w,h,'#fff');R(bx,y+h-2,w,2,'#dde');R(x-2,y+h,4,3,'#fff');R(x-1,y+h+3,2,2,'#fff');T(str,x,y+4,{color:'#1a1020',shadow:false});}
function confetti(u,n=60){for(let i=0;i<n;i++){const x=(i*53+Math.sin(u*2+i)*10+320)%320,y=((u*40+i*37)%200)-20;R(x,y,2,2,PAL[i%PAL.length]);}}
function sunD(cx,cy,r){circ(cx,cy,r+4,'#fff6c8');circ(cx,cy,r+1,'#ffe88a');circ(cx,cy,r,'#ffd84a');circ(cx-2,cy-2,r-4,'#fff3a8');}
function cloudD(x,y,s=1){const sh='#d2def0';[[8,9,7],[18,7,9],[29,10,7],[14,12,6],[24,12,7]].forEach(([a,b,r])=>circ(x+a*s,y+b*s+2,Math.round(r*s),sh));
  [[8,8,7],[18,6,9],[29,9,7],[14,11,6],[24,11,7]].forEach(([a,b,r])=>circ(x+a*s,y+b*s,Math.round(r*s),'#ffffff'));}
function outline(cnv,col='#1a1020'){const x=cnv.getContext('2d'),w=cnv.width,h=cnv.height,id=x.getImageData(0,0,w,h),d=id.data,out=[];
  const op=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&d[(j*w+i)*4+3]>200;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(d[(j*w+i)*4+3]>200)continue;if(op(i+1,j)||op(i-1,j)||op(i,j+1)||op(i,j-1))out.push(j*w+i);}
  const [r,g,b]=hex(col);for(const p of out){d[p*4]=r;d[p*4+1]=g;d[p*4+2]=b;d[p*4+3]=255;}x.putImageData(id,0,0);}

/* ===================== PERSONAJES DETALLADOS ===================== */
const C={mamaSkin:'#8d5a3c',papaSkin:'#f3cfa8',kidSkin:'#c48a5f',mamaHair:'#2a1a14',papaHair:'#5a3a22',kidHair:'#1e1414'};
const SZ={adult:{t:14,l:12},teen:{t:13,l:11},kid:{t:10,l:7},toddler:{t:8,l:4}};
const SPR=new Map();
function drawPersonLocal(o,ox,oy){
  const sz=SZ[o.size||'adult'];
  const p=(x,y,w,h,c)=>R(ox+x,oy+y,w,h,c),px=(x,y,c)=>R(ox+x,oy+y,1,1,c);
  const skin=o.skin,sS=dk(skin,.82),sH=lg(skin,.18);
  const hc=o.hairColor||'#222',hS=dk(hc,.7),hH=lg(hc,.3);
  const tY=18,lY=18+sz.t,shY=lY+sz.l;
  const top=o.dress?o.dressColor:(o.top||'#3b6db3'),tS=dk(top,.78),tH=lg(top,.2);
  const wf=o.wf||0;
  // pelo largo (atrás)
  if(o.hair==='long'){p(2,3,18,23,hc);p(2,3,2,23,hS);p(18,3,2,23,hS);p(3,26,4,1,hc);p(9,26,4,1,hc);p(15,26,4,1,hc);}
  if(o.bun){p(7,-3,8,4,hc);p(8,-4,6,1,hc);px(9,-3,hH);px(10,-3,hH);}
  if(o.veil){ctx.globalAlpha=.5;p(1,-1,20,shY-3,'#ffffff');p(0,shY-12,22,10,'#ffffff');ctx.globalAlpha=1;}
  if(o.backpack){p(15,tY+1,6,9,'#d9442e');p(16,tY+2,4,2,'#f06a50');p(16,tY+6,4,1,'#a8301e');}
  // piernas y zapatos
  const shoeC=o.shoe||'#2a1a10';
  const shoe=(x,y,w=5)=>{p(x,y,w,2,shoeC);px(x+1,y,lg(shoeC,.35));};
  if(!o.dress){const pc=o.bottom||'#2b2b3b',pS=dk(pc,.75);
    const liftL=wf===1?2:0,liftR=wf===3?2:0;
    p(6,lY,4,sz.l-liftL,pc);p(9,lY,1,sz.l-liftL,pS);p(12,lY,4,sz.l-liftR,pc);p(15,lY,1,sz.l-liftR,pS);
    shoe(5,shY-liftL);shoe(12,shY-liftR);}
  // torso
  p(5,tY,12,1,top);p(4,tY+1,14,sz.t-1,top);p(15,tY+1,3,sz.t-1,tS);p(4,lY-1,14,1,tS);p(5,tY+1,1,Math.max(1,sz.t-3),tH);
  if(o.stripe){p(4,tY+3,14,1,lg(top,.45));p(4,tY+6,14,1,lg(top,.45));}
  if(o.dress){const wy=lY-2,rows=shY-wy+1;
    for(let r=0;r<rows;r++){const e=Math.floor(r/3),xl=4-e,xr=17+e;p(xl,wy+r,xr-xl+1,1,top);px(xr,wy+r,tS);px(xr-1,wy+r,tS);px(xl,wy+r,tH);if(r>2)for(let fx=xl+3;fx<xr-2;fx+=4)px(fx,wy+r,tS);}
    const e=Math.floor((rows-1)/3);p(4-e,shY,14+2*e,1,tS);
    p(4,wy,14,1,o.belt||tS);
    shoe(6,shY+1,4);shoe(12,shY+1,4);
    if(o.sparkle){px(7,wy+5,'#ffffff');px(14,wy+9,'#cfe8ff');px(9,wy+12,'#ffffff');px(16,wy+4,'#cfe8ff');}
    p(9,tY,4,2,skin);px(10,tY+2,skin);px(11,tY+2,skin);
    if(o.pearls){[[8,0],[9,1],[10,2],[11,2],[12,1],[13,0]].forEach(([x,y])=>px(x,tY+y,'#fdfaf0'));}}
  if(o.suit){for(let r=0;r<6;r++)p(8+(r>>1),tY+r,6-2*(r>>1),1,'#fafafa');
    if(o.bowtie){p(8,tY+1,2,2,'#111');p(12,tY+1,2,2,'#111');p(10,tY+1,2,2,'#333');}
    else{p(10,tY,2,1,dk(o.tie||'#c0283a',.7));p(10,tY+1,2,6,o.tie||'#c0283a');px(11,tY+2,lg(o.tie||'#c0283a',.3));}
    p(14,tY+3,2,1,'#fafafa');px(10,tY+9,dk(top,.5));
    if(o.flower){px(6,tY+3,'#ff6b8b');px(7,tY+3,'#ff6b8b');px(6,tY+2,'#ff9ac0');px(6,tY+4,'#2e8b3e');}}
  if(o.collar){p(8,tY,2,1,lg(top,.6));p(12,tY,2,1,lg(top,.6));p(10,tY,2,2,skin);px(10,tY+4,dk(top,.6));px(10,tY+7,dk(top,.6));}
  // brazos
  const sl=o.sleeve||top,slS=dk(sl,.78);
  const arm=(x,side)=>{
    if(o.armsUp){p(x,tY-7,3,9,sl);p(side?x+2:x,tY-7,1,9,slS);p(x,tY-10,3,3,skin);px(side?x+2:x,tY-10,sS);return;}
    let dy=0;if(wf===1)dy=side?1:-1;if(wf===3)dy=side?-1:1;
    const len=sz.t-1;
    p(x,tY+1+dy,3,len,sl);p(side?x+2:x,tY+1+dy,1,len,slS);
    if(o.short){p(x,tY+5+dy,3,len-4,skin);p(side?x+2:x,tY+5+dy,1,len-4,sS);}
    if(o.suit)p(x,tY+len+dy,3,1,'#fafafa');
    p(x,tY+1+len+dy,3,3,skin);px(side?x+2:x,tY+3+len+dy,sS);};
  arm(1,0);arm(18,1);
  // cuello y cabeza
  p(9,16,4,2,sS);
  p(7,2,8,1,skin);p(5,3,12,1,skin);p(4,4,14,10,skin);p(5,14,12,1,skin);p(7,15,8,1,skin);
  p(16,4,2,10,sS);p(15,14,2,1,sS);p(13,15,2,1,sS);px(6,4,sH);px(5,5,sH);px(7,3,sH);
  p(3,8,1,3,skin);px(3,9,sS);p(18,8,1,3,sS);
  // pelo (frente)
  if(o.hair==='long'){p(7,0,8,1,hc);p(5,1,12,1,hc);p(4,2,14,1,hc);p(3,3,16,1,hc);p(3,4,8,1,hc);p(15,4,4,1,hc);p(3,5,4,1,hc);p(16,5,3,1,hc);p(3,6,2,10,hc);p(17,6,2,10,hc);
    [[9,0],[10,0],[7,1],[8,1],[6,2],[5,3],[6,4],[7,4]].forEach(([x,y])=>px(x,y,hH));px(4,10,hS);px(17,12,hS);}
  if(o.hair==='short'){p(6,0,10,1,hc);p(4,1,14,1,hc);p(3,2,16,2,hc);p(3,4,5,1,hc);p(9,4,4,1,hc);p(15,4,4,1,hc);p(3,5,3,1,hc);p(10,5,2,1,hc);p(17,5,2,1,hc);p(3,6,2,3,hc);p(17,6,2,3,hc);
    [[7,1],[8,1],[9,1],[6,2],[5,2]].forEach(([x,y])=>px(x,y,hH));}

let MODE='game',RT=0,DT=0,HOLD=Infinity,CUR_START=0;

/* Compuerta: la escena se queda quieta en el tiempo g hasta que se cumpla.
   - con cond: espera esa condición (en ambos modos)
   - sin cond: en videojuego espera un toque; en video espera vwait segundos */
function gate(S,key,t,g,opt={}){
  if(S[key])return true;if(t<g)return false;
  let ok;
  if(opt.cond!==undefined)ok=opt.cond;
  else if(isVideo())ok=(S[key+'_w']=(S[key+'_w']||0)+DT)>=(opt.vwait??1);
  else{ok=INPUT.tap;if(ok)INPUT.tap=false;}
  if(ok){S[key]=true;return true;}
  HOLD=Math.min(HOLD,CUR_START+g);
  if(!isVideo()&&opt.prompt)promptBox(opt.prompt);
  return false;
}

  if(!paused){RT+=dtR;let nE=E+dtR;if(nE>HOLD)nE=Math.max(E,HOLD);E=nE;}
  HOLD=Infinity;
  let i=SCENES.length-1;while(i>0&&E<SCENES[i].start)i--;
  const sc=SCENES[i],t=E-sc.start;CUR_START=sc.start;
  if(i!==sceneIdx){sceneIdx=i;againBtn.style.display='none';enterScene(sc,t);}
  if(!paused)sc.cues.forEach((c,k)=>{if(!sc.fired[k]&&t>=c[0]){sc.fired[k]=true;c[1]();}});
  ctx=mainCtx;ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;
  if(paused){INPUT.tap=false;INPUT.taps.length=0;HOLD=E;}
  sc.draw(t,sc.state,DT);
  INPUT.tap=false;INPUT.taps.length=0;
  if(paused){R(0,0,W,H,'rgba(0,0,0,.5)');T('PAUSA',160,84,{size:16});}
  schedMusic();
}
requestAnimationFrame(frame);

/* ===================== INTERFAZ ===================== */
const startEl=document.getElementById('start'),ui=document.getElementById('ui'),muteBtn=document.getElementById('mute'),pauseBtn=document.getElementById('pause'),screenEl=document.getElementById('screen');
document.getElementById('startSub').textContent='Una aventura para '+CONFIG.mama+' y '+CONFIG.papa;
document.fonts&&document.fonts.load("8px 'Press Start 2P'").catch(()=>{});
let built=false;
async function begin(){
  MODE='game';initAudio();
  try{const d=document.documentElement;if(d.requestFullscreen&&!document.fullscreenElement){await d.requestFullscreen({navigationUI:'hide'});if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape').catch(()=>{});}}catch(err){}if(AC&&AC.state==='suspended'){try{await AC.resume();}catch(err){}}
  try{await Promise.race([document.fonts.load("8px 'Press Start 2P'"),new Promise(r=>setTimeout(r,1500))]);}catch(err){}
  if(!built){buildBGs();getFrame();built=true;}
  startEl.style.display='none';INPUT.px=null;setPaused(false);started=true;seek(0);showUI();
}
document.getElementById('mGame').addEventListener('click',e=>{e.stopPropagation();begin();});
let hideT=null;
function showUI(){if(!started)return;ui.classList.add('show');clearTimeout(hideT);hideT=setTimeout(()=>ui.classList.remove('show'),2500);}
const isUI=el=>el.closest&&el.closest('button,#ui,#start');
screenEl.addEventListener('pointerdown',e=>{if(!started||isUI(e.target))return;e.preventDefault();showUI();const g=toGame(e.clientX,e.clientY);INPUT.tap=true;INPUT.last=RT;INPUT.px=g.x;INPUT.taps.push(g);});
screenEl.addEventListener('pointermove',e=>{if(!started)return;if(e.pointerType==='mouse')showUI();if(isUI(e.target))return;if(e.pointerType==='mouse'||e.buttons){INPUT.px=toGame(e.clientX,e.clientY).x;INPUT.last=RT;}});
screenEl.addEventListener('contextmenu',e=>e.preventDefault());
function setPaused(p){if(p===paused)return;if(p){paused=true;AC&&AC.suspend();}else{paused=false;AC&&AC.resume();}pauseBtn.textContent=paused?'SEGUIR':'PAUSA';}
pauseBtn.addEventListener('click',e=>{e.stopPropagation();setPaused(!paused);});
muteBtn.addEventListener('click',e=>{e.stopPropagation();muted=!muted;if(master)master.gain.value=muted?0:.55;muteBtn.textContent=muted?'SONIDO: NO':'SONIDO: SÍ';});
document.getElementById('menu').addEventListener('click',e=>{e.stopPropagation();started=false;stopMusic();againBtn.style.display='none';ui.classList.remove('show');startEl.style.display='flex';});
againBtn.addEventListener('click',e=>{e.stopPropagation();againBtn.style.display='none';startEl.style.display='flex';started=false;stopMusic();});
document.addEventListener('keydown',e=>{if(!started)return;const k=e.key;
  if(k===' '||k==='Enter'||k==='ArrowUp'){e.preventDefault();if(!e.repeat){INPUT.tap=true;INPUT.last=RT;}}
  else if(k==='ArrowLeft'){INPUT.left=true;INPUT.last=RT;}else if(k==='ArrowRight'){INPUT.right=true;INPUT.last=RT;}
  else if(k==='n'||k==='N')nextScene();else if(k==='p'||k==='P')setPaused(!paused);});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')INPUT.left=false;if(e.key==='ArrowRight')INPUT.right=false;});
document.addEventListener('visibilitychange',()=>{if(!started)return;if(document.hidden){if(!paused){setPaused(true);autoPaused=true;}}else if(autoPaused){autoPaused=false;setPaused(false);}});
</script>
</body>
